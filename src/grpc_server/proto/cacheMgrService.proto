syntax = "proto3";

import "nfsProtoUtil.proto";

package cacheMgr;

message IdMapperUserEntry
{
	string name = 1;
	uint32 uid = 2;
	bool gid_set = 3;
	uint32 gid = 4;
}

message ShowIdMapperUsersResponse
{
	uint64 timestamp_sec = 1;
	uint64 timestamp_nsec = 2;
	repeated IdMapperUserEntry entries = 3;
}

message IdMapperGroupEntry
{
	string name = 1;
	uint32 gid = 2;
}

message ShowIdMapperGroupsResponse
{
	uint64 timestamp_sec = 1;
	uint64 timestamp_nsec = 2;
	repeated IdMapperGroupEntry entries = 3;
}

message NegativeCacheEntry
{
	string name = 1;
	uint64 epoch = 2;
}

message ShowNegativeUsersResponse
{
	uint64 timestamp_sec = 1;
	uint64 timestamp_nsec = 2;
	repeated NegativeCacheEntry entries = 3;
}

message ShowNegativeGroupsResponse
{
	uint64 timestamp_sec = 1;
	uint64 timestamp_nsec = 2;
	repeated NegativeCacheEntry entries = 3;
}

message ShowNegativeUIDsResponse
{
	uint64 timestamp_sec = 1;
	uint64 timestamp_nsec = 2;
	repeated NegativeCacheEntry entries = 3;
}

message Uid2GrpEntry
{
	string name = 1;
	uint32 uid = 2;
}

message ShowUid2GrpResponse
{
	uint64 timestamp_sec = 1;
	uint64 timestamp_nsec = 2;
	repeated Uid2GrpEntry entries = 3;
}

service CacheMgrService
{
	rpc ShowIdMapperUsers(nfsProtoUtil.EmptyRequest)
		returns (ShowIdMapperUsersResponse);

	rpc ShowIdMapperGroups(nfsProtoUtil.EmptyRequest)
		returns (ShowIdMapperGroupsResponse);

	rpc ShowNegativeUsers(nfsProtoUtil.EmptyRequest)
		returns (ShowNegativeUsersResponse);

	rpc ShowNegativeGroups(nfsProtoUtil.EmptyRequest)
		returns (ShowNegativeGroupsResponse);

	rpc ShowNegativeUIDs(nfsProtoUtil.EmptyRequest)
		returns (ShowNegativeUIDsResponse);

	rpc ShowUid2Grp(nfsProtoUtil.EmptyRequest)
		returns (ShowUid2GrpResponse);
}

syntax = "proto3";

import "nfsProtoUtil.proto";

package exportService;

/* Export manager statistics exposed over gRPC.
 * This file mirrors the D-Bus interface org.ganesha.nfsd.exportstats
 * defined in support/export_mgr.c. Each RPC name matches the existing
 * D-Bus method name (e.g. GetNFSv41IO) so callers can migrate from
 * D-Bus to gRPC without changing semantics. Shared request/response
 * field types live in nfsProtoUtil.proto and
 * may be reused by other gRPC modules.
 */

message ExportIoStatsResponse
{
	nfsProtoUtil.StatusResponse status = 1;
	nfsProtoUtil.Timestamp time = 2;
	nfsProtoUtil.IoStats read = 3;
	nfsProtoUtil.IoStats write = 4;
}

message TotalOps
{
	uint64 nfsv3 = 1;
	uint64 nfsv40 = 2;
	uint64 nfsv41 = 3;
	uint64 nfsv42 = 4;
}

message GetTotalOPSResponse
{
	nfsProtoUtil.StatusResponse status = 1;
	nfsProtoUtil.Timestamp time = 2;
	TotalOps total_ops = 3;
}

message GlobalTotalOps
{
	TotalOps nfs = 1;
	uint64 nlm4 = 5;
	uint64 mntv1 = 6;
	uint64 mntv3 = 7;
	uint64 rquota = 8;
}

message GetGlobalOPSResponse
{
	nfsProtoUtil.StatusResponse status = 1;
	nfsProtoUtil.Timestamp time = 2;
	GlobalTotalOps total_ops = 3;
}

message ExportIOEntry
{
	uint32 export_id = 1;
	string version = 2;
	nfsProtoUtil.IoStats read = 3;
	nfsProtoUtil.IoStats write = 4;
}

message GetNFSIOResponse
{
	nfsProtoUtil.StatusResponse status = 1;
	nfsProtoUtil.Timestamp time = 2;
	repeated ExportIOEntry entries = 3;
}

message ExportLayoutsResponse
{
	nfsProtoUtil.StatusResponse status = 1;
	nfsProtoUtil.Timestamp time = 2;
	nfsProtoUtil.LayoutStats getdevinfo = 3;
	nfsProtoUtil.LayoutStats layout_get = 4;
	nfsProtoUtil.LayoutStats layout_commit = 5;
	nfsProtoUtil.LayoutStats layout_return = 6;
	nfsProtoUtil.LayoutStats layout_recall = 7;
}

message ExportOpStatsResponse
{
	nfsProtoUtil.StatusResponse status = 1;
	nfsProtoUtil.Timestamp time = 2;
	nfsProtoUtil.OpStats op_stats = 3;
}

message FastOperation
{
	string operation = 1;
	uint64 count = 2;
}

message ProtocolFastOps
{
	string protocol = 1;
	repeated FastOperation operations = 2;
}

message GetFastOPSResponse
{
	nfsProtoUtil.StatusResponse status = 1;
	nfsProtoUtil.Timestamp time = 2;
	repeated ProtocolFastOps protocols = 3;
}

message FullOperationStats
{
	string operation = 1;
	uint64 total = 2;
	uint64 errors = 3;
	// Only used for NFSv3. Will be 0 for NFSv4.
	uint64 duplicates = 4;
	double avg_latency = 5;
	double min_latency = 6;
	double max_latency = 7;
}

message GetFULLV3StatsResponse
{
	nfsProtoUtil.StatusResponse status = 1;
	nfsProtoUtil.Timestamp time = 2;
	repeated FullOperationStats stats = 3;
	string message = 4;
}

message GetFULLV4StatsResponse
{
	nfsProtoUtil.StatusResponse status = 1;
	nfsProtoUtil.Timestamp time = 2;
	repeated FullOperationStats stats = 3;
	string message = 4;
}

message ResetStatsResponse
{
	nfsProtoUtil.StatusResponse status = 1;
	nfsProtoUtil.Timestamp time = 2;
}

enum StatisticsType {
	STATISTICS_TYPE_ALL = 0;
	STATISTICS_TYPE_NFS = 1;
	STATISTICS_TYPE_FSAL = 2;
	STATISTICS_TYPE_V3_FULL = 3;
	STATISTICS_TYPE_V4_FULL = 4;
	STATISTICS_TYPE_AUTH = 5;
	STATISTICS_TYPE_CLIENT_ALL_OPS = 6;
}

message EnableStatsRequest
{
	StatisticsType stat_type = 1;
}

message EnableStatsResponse
{
	nfsProtoUtil.StatusResponse status = 1;
	nfsProtoUtil.Timestamp time = 2;
}

message DisableStatsRequest
{
	StatisticsType stat_type = 1;
}

message DisableStatsResponse
{
	nfsProtoUtil.StatusResponse status = 1;
	nfsProtoUtil.Timestamp time = 2;
}

message StatsStatus
{
	bool enabled = 1;
	nfsProtoUtil.Timestamp time = 2;
}

message StatusStatsResponse
{
	nfsProtoUtil.StatusResponse status = 1;
	StatsStatus nfs = 2;
	StatsStatus fsal = 3;
	StatsStatus v3_full = 4;
	StatsStatus v4_full = 5;
	StatsStatus auth = 6;
	StatsStatus client_all_ops = 7;
}

message AuthStats
{
	uint64 total = 1;
	double avg_latency = 2;
	double max_latency = 3;
	double min_latency = 4;
}

message GetAuthStatsResponse
{
	nfsProtoUtil.StatusResponse status = 1;
	nfsProtoUtil.Timestamp time = 2;
	AuthStats group_cache = 3;
	AuthStats winbind = 4;
	AuthStats dns = 5;
}

enum FdState {
	FD_LOW = 0;
	FD_MIDDLE = 1;
	FD_HIGH = 2;
	FD_LIMIT = 3;
}

message MDCacheStats
{
	uint64 cache_requests = 1;
	uint64 cache_hits = 2;
	uint64 cache_misses = 3;
	uint64 cache_conflicts = 4;
	uint64 cache_adds = 5;
	uint64 cache_mapping = 6;
}

message LruUtilization
{
	uint64 entries_used = 1;
	uint64 chunks_used = 2;
}

message ShowMDCacheResponse
{
	nfsProtoUtil.StatusResponse status = 1;
	nfsProtoUtil.Timestamp time = 2;
	MDCacheStats cache = 3;
	LruUtilization lru = 4;
}

message FDUsageSummary
{
	uint32 fd_limit = 1;
	uint32 fd_lowat = 2;
	uint32 fd_hiwat = 3;
	uint32 fd_hard_limit = 4;
	FdState fd_state = 5;
	uint32 global_fds = 6;
	uint32 state_fds = 7;
	uint64 v4_open_states = 8;

	// LRU utilization
	uint64 open_fds = 9;
}

message ShowFDUsageResponse
{
	nfsProtoUtil.StatusResponse status = 1;
	nfsProtoUtil.Timestamp time = 2;
	FDUsageSummary summary = 3;
}

message GetExportDetailsResponse
{
	nfsProtoUtil.StatusResponse status = 1;
	nfsProtoUtil.Timestamp time = 2;

	nfsProtoUtil.VersionCeStats nfsv3 = 3;
	nfsProtoUtil.VersionCeStats nfsv40 = 4;
	nfsProtoUtil.VersionCeStats nfsv41 = 5;
	nfsProtoUtil.VersionCeStats nfsv42 = 6;
}

// Per-Export NFS version I/O statistics
service ExportStats
{
	rpc GetNFSv3IO(nfsProtoUtil.ExportIdRequest)
		returns (ExportIoStatsResponse);
	rpc GetNFSv40IO(nfsProtoUtil.ExportIdRequest)
		returns (ExportIoStatsResponse);
	rpc GetNFSv41IO(nfsProtoUtil.ExportIdRequest)
		returns (ExportIoStatsResponse);
	rpc GetNFSv42IO(nfsProtoUtil.ExportIdRequest)
		returns (ExportIoStatsResponse);
	rpc GetNFSMonIO(nfsProtoUtil.ExportIdRequest)
		returns (ExportIoStatsResponse);
	rpc GetTotalOPS(nfsProtoUtil.ExportIdRequest)
		returns (GetTotalOPSResponse);
	rpc GetGlobalOPS(nfsProtoUtil.EmptyRequest)
		returns (GetGlobalOPSResponse);
	rpc GetNFSIO(nfsProtoUtil.EmptyRequest) returns (GetNFSIOResponse);
	rpc GetNFSv41Layouts(nfsProtoUtil.ExportIdRequest)
		returns (ExportLayoutsResponse);
	rpc GetNFSv42Layouts(nfsProtoUtil.ExportIdRequest)
		returns (ExportLayoutsResponse);
	rpc Get9pIO(nfsProtoUtil.ExportIdRequest)
		returns (ExportIoStatsResponse);
	rpc Get9pOpStats(nfsProtoUtil.Export9pOpRequest)
		returns (ExportOpStatsResponse);
	rpc GetFastOPS(nfsProtoUtil.EmptyRequest) returns (GetFastOPSResponse);
	rpc GetFULLV3Stats(nfsProtoUtil.EmptyRequest)
		returns (GetFULLV3StatsResponse);
	rpc GetFULLV4Stats(nfsProtoUtil.EmptyRequest)
		returns (GetFULLV4StatsResponse);
	rpc ResetStats(nfsProtoUtil.EmptyRequest) returns (ResetStatsResponse);
	rpc EnableStats(EnableStatsRequest) returns (EnableStatsResponse);
	rpc DisableStats(DisableStatsRequest) returns (DisableStatsResponse);
	rpc StatusStats(nfsProtoUtil.EmptyRequest)
		returns (StatusStatsResponse);
	rpc GetAuthStats(nfsProtoUtil.EmptyRequest)
		returns (GetAuthStatsResponse);
	rpc ShowMDCache(nfsProtoUtil.EmptyRequest)
		returns (ShowMDCacheResponse);
	rpc ShowFDUsage(nfsProtoUtil.EmptyRequest)
		returns (ShowFDUsageResponse);
	rpc GetExportDetails(nfsProtoUtil.ExportIdRequest)
		returns (GetExportDetailsResponse);
}

message ExportClientEntry
{
	string client_name = 1;
	int32 cidr_version = 2;
	bytes cidr_addr = 3;
	bytes cidr_mask = 4;
	int32 cidr_proto = 5;
	uint32 anonymous_uid = 6;
	uint32 anonymous_gid = 7;
	uint32 expire_time_attr = 8;
	string client_type = 9;
	string client_permissions = 10;
}

message DisplayExportResponse
{
	uint32 export_id = 1;
	string full_path = 2;
	string pseudo_path = 3;
	repeated ExportClientEntry clients = 4;
	bool success = 5;
	string error_message = 6;
	string export_permissions = 7;
}

// Request for both Add & Update of an export
message ExportRequest
{
	string file_path = 1; // Path to config file with EXPORT {...}
	string export_expression = 2; // Expression to select parts of config
}

// Response for Add, Update and Removal of an export
message ExportResponse
{
	bool success = 1;
	string message = 2; // Success message or error details
}

service ExportService
{
	rpc DisplayExport(nfsProtoUtil.ExportIdRequest)
		returns (DisplayExportResponse);
	rpc ShowExports(nfsProtoUtil.EmptyRequest)
		returns (ShowExportsResponse);
	rpc AddExport(ExportRequest) returns (ExportResponse);
	rpc RemoveExport(nfsProtoUtil.ExportIdRequest)
		returns (ExportResponse);
	rpc UpdateExport(ExportRequest) returns (ExportResponse);
}

message Timestamp {
	uint64 tv_sec = 1;
	uint64 tv_nsec = 2;
}

message ProtocolActivity {
	string name = 1;
	bool active = 2;
}

message ExportInfo
{
	uint32 export_id = 1;
	string full_path = 2;
	string pseudo_path = 3;
	string fs_tag = 4;
	repeated ProtocolActivity protocols = 5;
	uint64 total_ops = 6;
	Timestamp last_update = 7;
}
message ShowExportsResponse
{
	uint64 timestamp_sec = 1;
	uint64 timestamp_nsec = 2;
	repeated ExportInfo exports = 3;
	bool success = 4;
	string error_message = 5;
}
